# Nginx como proxy delante de gunicorn (servicio web).
# Nginx escucha en el 80 del contenedor y reenvía todo a http://web:8000.
server {
    listen 80;
    server_name _;

    location / {
        # "web" es el nombre del servicio gunicorn dentro de la red del compose.
        proxy_pass http://web:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
